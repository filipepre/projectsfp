<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Meu Site</title>
    <link rel="stylesheet" href="style.css">
    <script src="../../../js/auth.js"></script>
</head>

<body>
    <script src="../../../js/loader.js"></script>
    <script src="../../../js/translator.js"></script>
    <script src="script.js"></script>

    <div id="header"></div>

    <h1 data-i18n="projectsEditTitle"></h1>

    <div class="container">

        <div class="form-group">
            <label data-i18n="nameProjectTable"></label>
            <input id="name" placeholder="Nome" />
        </div>

        <div class="form-group">
            <label data-i18n="descriptionTable"></label>
            <textarea id="description" placeholder="Descrição"></textarea>
        </div>

        <div class="form-group">
            <label data-i18n="creationDateTable"></label>
            <input id="limit_date" type="date" />
        </div>

        <!-- 🔥 LISTA DE TAREFAS AQUI -->
        <div class="tasks-section">
            <h3 data-i18n="tasks"></h3>
            <div id="taskList"></div>
            <!-- 🔥 NOVA TAREFA -->
            <div class="add-task">
                <input id="newTaskInput" data-i18n-placeholder="newTaskPlaceholder" />
                <button onclick="addTask()">+</button>
            </div>
        </div>

        <div class="actions">
            <button onclick="save()" data-i18n="save"></button>
            <button class="cancel" onclick="goBack()" data-i18n="cancel"></button>
        </div>

    </div>

</body>

</html>
